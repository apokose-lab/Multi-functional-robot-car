[platformio]
default_envs = esp32s3_brain, motion2350_pro

; ==========================================================
; BRAIN FIREBEETLE 2 ESP32-S3
; ==========================================================
[env:esp32s3_brain]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200

; Only compile file for esp32_brain in src/
build_src_filter = +<esp32_brain/*> -<motion2350_driver/*>

; Ignore some file so that they are not compiled for this environment
lib_ignore = 
    MotorPID
    ServoArm

; ==========================================================
; DRIVER CYTRON MOTION 2350 PRO
; ==========================================================
[env:motion2350_pro]
; Use core earlephilhower support chip RP2350 and already has PIO Encoder
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Only compile file for motion2350_driver in src/
build_src_filter = +<motion2350_driver/*> -<esp32_brain/*>

; Ignore some file so that they are not compiled for this environment
lib_ignore = 
    LidarSensor
    UltrasonicArray
    MecanumKinematics